<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="GAM — Possibilidade Imediata. Marketplace de Moçambique.">
  <title>GAM — Possibilidade Imediata</title>
  <style>
    :root{
      --bg:#f5f6f8;--surface:#fff;--ink:#172033;--muted:#687386;
      --gold:#e8bd45;--gold-dark:#b98a13;--line:#e5e8ee;--dark:#111827;
      --green:#16834b;--danger:#b42318;--radius:18px;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .topbar{background:var(--dark);color:#fff;padding:12px 16px;text-align:center;font-size:13px}
    header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
    .head-inner{max-width:1180px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:16px}
    .brand{display:flex;align-items:center;gap:10px;min-width:max-content}
    .logo{width:44px;height:44px;border-radius:14px;background:var(--gold);display:grid;place-items:center;color:#171717;font-weight:950;font-size:20px}
    .brand strong{display:block;font-size:19px;letter-spacing:.3px}
    .brand small{display:block;color:var(--muted);font-size:11px}
    .search{flex:1;display:flex;gap:8px;min-width:100px}
    .search input{width:100%;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#f8f9fb;outline:none}
    .search input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold-dark);box-shadow:0 0 0 3px #e8bd4530}
    .btn{border:0;border-radius:12px;padding:11px 15px;font-weight:750;transition:transform .12s ease,opacity .15s ease}
    .btn:active{transform:scale(.98)}
    .btn-gold{background:var(--gold);color:#171717}
    .btn-dark{background:var(--dark);color:#fff}
    .btn-light{background:#f0f2f5;color:var(--ink)}
    .btn-danger{background:#fff0ef;color:var(--danger)}
    .head-actions{display:flex;gap:8px;align-items:center}
    .cart-count{display:inline-grid;place-items:center;background:var(--gold);color:#171717;border-radius:50%;width:21px;height:21px;font-size:11px;margin-left:4px;font-weight:900}
    main{max-width:1180px;margin:24px auto;padding:0 18px 60px}
    .hero{background:linear-gradient(115deg,#151d2d,#26364c);border-radius:24px;color:white;padding:30px;display:grid;grid-template-columns:1.4fr .8fr;gap:20px;align-items:center;overflow:hidden}
    .hero h1{font-size:clamp(27px,4vw,44px);line-height:1.08;margin:8px 0 12px}
    .hero p{color:#d5dbe5;max-width:570px;line-height:1.6;margin:0 0 18px}
    .hero-tag{display:inline-block;color:#171717;background:var(--gold);font-size:12px;font-weight:850;padding:6px 10px;border-radius:99px}
    .hero-art{font-size:clamp(75px,12vw,135px);text-align:center;filter:drop-shadow(0 15px 18px #0005)}
    .hero-actions{display:flex;flex-wrap:wrap;gap:10px}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:30px 0 15px}
    h2{font-size:22px;margin:0}
    .muted{color:var(--muted);font-size:13px}
    .categories{display:flex;gap:9px;overflow-x:auto;padding:2px 0 7px;margin-bottom:14px}
    .chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 14px;white-space:nowrap;color:#384256;font-weight:650}
    .chip.active{background:var(--dark);color:#fff;border-color:var(--dark)}
    .product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
    .product-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;
